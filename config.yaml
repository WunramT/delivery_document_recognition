# docval configuration. Paths are relative to the repo root unless absolute.
# ${VAR:-default} is expanded from the environment (the devcontainer sets
# DOCVAL_DATA=/data, a read-only mount of labels/).

seed: 42

paths:
  # Several label exports side by side (optional): <exports>/<name>/{_annotations.coco.json,
  # images/, page_types.csv, tour_numbers.csv}. If present they are merged automatically and
  # coco/images/page_types below are ignored.
  exports: ${DOCVAL_DATA:-labels}/exports
  coco: ${DOCVAL_DATA:-labels}/_annotations.coco.json
  images: ${DOCVAL_DATA:-labels}/images
  artifacts: ${DOCVAL_ARTIFACTS:-artifacts}   # all derived data (gitignored)
  labels: labels                               # writable label CSVs / review page
  models: ${DOCVAL_MODELS:-artifacts/models_cache}  # downloaded weights (docker volume)

classes: [unterschrift, stempel, tour_nummer, cmr_count]
doc_types: [cmr, lieferschein, loading_list]

# Where ground truth for doc type and tour number comes from.
labels:
  doc_type:
    source: csv                    # csv | coco_attribute
    coco_attribute: null           # e.g. "extra.doc_type" (dotted path in image dict)
    csv: ${DOCVAL_DATA:-labels}/page_types.csv  # delimiter and columns auto-detected
    csv_file_column: null          # null = auto (file_name, filename, image, ...)
    csv_value_column: null         # null = auto (doc_type, page_type, type, ...)
  tour_number:
    source: csv                    # csv | coco_attribute
    coco_attribute: attributes.text
    csv: labels/tour_numbers.csv   # "?" = unreadable in GT
    # tour/date/number, e.g. 503/01.09.2026/4000 (all three parts = the tour number).
    # Kept as a string: leading zeros matter.
    format_regex: '^\d+/\d{2}\.\d{2}\.\d{4}/\d+$'

# ---------------------------------------------------------------- step 2: split
split:
  ratios: {train: 0.70, valid: 0.15, test: 0.15}
  # segment: shipments inside a scan batch (new segment at each block of
  #          segment_start_types, own segment for own_segment_types)
  # source_pdf | tour_number | none are the alternatives
  group_by: segment
  segment_start_types: [cmr]
  own_segment_types: [loading_list]
  # Only one loading list exists -> its pages are split individually so every
  # split contains one. Leakage risk, stated in the report.
  ungroup_doc_types: [loading_list]

# ---------------------------------------------------------------- step 3: detector
detector:
  size: nano                  # nano | small | medium (Apache-2.0 only; no XL/2XL)
  # page is squashed to res x res: at 384 (nano default) a tour_nummer box is
  # ~9 px tall, at 640 ~15 px. Must be a multiple of 32. null = model default.
  resolution: 640
  epochs: 150
  batch_size: 2
  grad_accum_steps: 4
  lr: 1.0e-4
  num_workers: 2
  # rfdetr default multi_scale=true trains at the largest scale (e.g. 800 px for
  # resolution 640) while export/eval run at `resolution`. false = same size everywhere.
  multi_scale: false
  early_stopping: true
  early_stopping_patience: 40
  device: auto                # auto | cpu | cuda
  onnx_opset: 17
  # evaluation
  # auto = per class the best-F1 threshold on the valid split (test stays untouched);
  # or a number for all classes. The P/R tables in the report help to choose.
  score_threshold: auto
  score_threshold_fallback: 0.5   # if a class has no GT in valid
  score_uncertain_factor: 0.6     # [factor x threshold, threshold) -> "unsicher"
  iou_match: 0.5
  parity:                     # PyTorch vs. ONNX Runtime (CPU)
    n_images: 20
    max_box_diff: 0.005       # normalized coords (0.005 = ~3 px at 640 px input)
    max_score_diff: 0.005
    # additionally: every PyTorch detection >= score_threshold needs an ONNX counterpart

# ---------------------------------------------------------------- step 4: doc type
doctype:
  header_fraction: 0.20       # OCR on the top 20 % of the page
  fuzzy_min_len: 7            # keywords >= 7 chars tolerate 1 OCR error
  priority: []                # tie-break if several types match, e.g. [cmr]
  keywords:
    cmr: [CMR, Frachtbrief, List przewozowy, Lettre de voiture, Consignment note]
    # from the OCR header texts in the report (keyword misses): the Lieferschein header
    # has no title in the top 20 %, but the address block "Lieferanschrift"
    lieferschein: [Lieferschein, Delivery note, Dowód dostawy, Wydanie zewnętrzne, Dokument WZ, Lieferanschrift]
    loading_list: [Loading List, Ladeliste, List załadunkowy, Lista załadunkowa, Lista załadowcza, Lista załadunku]
  classifier:
    enabled: true
    model: mobilenetv3_small_100  # timm, Apache-2.0
    img_size: 320
    epochs: 15
    batch_size: 8
    lr: 1.0e-3
    min_confidence: 0.80      # below -> unsicher (if no keyword)
    conflict_confidence: 0.90 # keyword vs. confident classifier disagree -> unsicher

# ---------------------------------------------------------------- step 5: zones
zones:
  percentiles: [2, 98]        # of the box centers in the train split
  margin: 0.03                # added on every side (fraction of the page)
  min_samples: 3
  min_overlap: 0.5            # share of a detected box that must lie in the zone
  rules:                      # what is required per doc type
    # CMR: the searched signature (mostly field 24, but may be elsewhere) + stamp
    # anywhere in the signature area at the bottom (fields 22-24, see overrides).
    cmr:
      require: [unterschrift, stempel]
      mode: all
      # allowed secondary place: CMR field 13 is also used for signature/stamp.
      # Found only there -> "unsicher" = a person checks (action: ok -> accepted).
      # Box is an approximation - check it against the list "außerhalb der Soll-Zone"
      # in the report (section 3) and correct it here.
      review_zones:
        "Feld 13": {box: [0.00, 0.50, 0.60, 0.75], action: review, classes: [unterschrift, stempel]}
    # Strict alternative, if every field must be signed (needs ALL signatures annotated):
    # cmr:
    #   fields:
    #     "22 Absender":     {box: [0.00, 0.72, 0.34, 1.00], require: [unterschrift]}
    #     "23 Frachtführer": {box: [0.34, 0.72, 0.67, 1.00], require: [unterschrift]}
    #     "24 Empfänger":    {box: [0.67, 0.72, 1.00, 1.00], require: [unterschrift]}
    # other types: no signature required, position not checked
    lieferschein: {require: []}
    loading_list: {require: []}
  # manual corrections of the derived zones (only the given edges are replaced).
  # CMR: the searched signature/stamp may be in field 22, 23 or 24 -> full width.
  overrides:
    cmr:
      unterschrift: {x1: 0.0, x2: 1.0}
      stempel: {x1: 0.0, x2: 1.0}
  synthetic:
    fill: median              # median | white
    kinds: [remove_one, remove_all, move_one]

# Pre-printed stamp+signature in CMR fields 22/23 (scanned originals printed onto the
# form) look like real ones. The field row 22/23/24 is found from the printed frame
# lines and fields 22 + 23 are filled white including their border - before training
# and before detection. Only the real signature/stamp (field 24) remains.
form_mask:
  enabled: true
  doc_types: [cmr]
  mask_fields: [0, 1]       # cells of the field row, left to right: 0 = 22, 1 = 23, 2 = 24
  search_y: [0.60, 1.00]    # vertical search window (fraction of page height)
  min_cells: 3              # the row must have at least this many cells
  cell_min_w: 0.18          # plausible cell width (fraction of page width)
  cell_max_w: 0.50
  cell_min_h: 0.04          # plausible cell height (fraction of page height)
  line_min_frac: 0.08       # minimum length of a frame line (fraction of the page)
  border_px: 6              # also mask the frame lines around the cell
  fill: white               # white | black

# ---------------------------------------------------------------- step 6: OCR
ocr:
  crop_padding: 0.12          # 10-15 % around the tour_nummer box
  min_score: 0.90             # auto-accept only above this recognition score
  # official ONNX exports (Hugging Face, Apache-2.0); first engine = primary
  engines:
    ppocrv5:
      det: PaddlePaddle/PP-OCRv5_mobile_det_onnx
      rec: PaddlePaddle/PP-OCRv5_mobile_rec_onnx
      header_rec: PaddlePaddle/latin_PP-OCRv5_mobile_rec_onnx   # de/pl keywords
    ppocrv6:
      det: PaddlePaddle/PP-OCRv6_small_det_onnx
      rec: PaddlePaddle/PP-OCRv6_small_rec_onnx
      header_rec: PaddlePaddle/PP-OCRv6_small_rec_onnx
  det_limit_side_len: 960
  modes: [rec_only, det_rec]
  doc_types: [cmr, lieferschein]   # tour number is read/evaluated only here (loading list: not relevant)
  # variant for the acceptance criterion and the pipeline. det_rec: the annotated box
  # holds several lines (label + number) - recognition alone reads them as one line.
  primary: ppocrv5/det_rec
  paddle_reference: true      # PaddleOCR Python pipeline on GT crops as reference
  read_cmr_count: true

# ---------------------------------------------------------------- step 7: acceptance
acceptance:
  doc_types: [cmr, lieferschein]   # criteria only on relevant documents (loading list excluded)
  detector_recall:            # Recall@IoU0.5 on the test split, only where the object matters
    unterschrift: {min: 0.95, doc_types: [cmr]}   # required only on CMR
    stempel: {min: 0.95, doc_types: [cmr]}
    tour_nummer: {min: 0.98, doc_types: [cmr, lieferschein]}
  doctype_accuracy: 0.98      # without "unsicher"
  doctype_uncertain_max: 0.05
  position_recall_negatives: 0.95
  position_false_alarm_max: 0.05
  tour_exact_match_accepted: 0.99
  tour_acceptance_target: 0.90  # reported, not a hard criterion
  fail_on_missing_gt: true    # e.g. no tour numbers entered yet -> criterion failed
  enforce: true               # exit code != 0 if a criterion is missed

report:
  gallery_size: 30

inspect:
  bbox_tolerance_px: 1.0
  tour_crop_padding: 0.12
  near_duplicate_hash_distance: 6
  compute_image_hashes: true
  name_keywords:              # only hints in file/folder names, never GT
    cmr: [cmr]
    lieferschein: [lieferschein, delivery, ls, wz, dn]
    loading_list: [loading, ladeliste, ladeschein, loadinglist, zaladunk, packlist]
